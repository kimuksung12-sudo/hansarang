<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>업무 홈 | 케어플랜 체크</title>
  <link rel="stylesheet" href="./css/style.css" />
  <script type="module" src="./js/dashboard.js"></script>
</head>
<body class="dashboard-page">
  <main class="dashboard-layout">
    <div class="dashboard-loading" id="checkingNotice" role="status">직원 계정과 접근 권한을 확인하고 있습니다...</div>
    <div id="privateDashboard" hidden>
      <header class="dashboard-header">
        <div class="brand dashboard-brand">
          <span class="brand-logo"><img src="./assets/hanmaeum-logo.png" width="56" height="56" alt="한마음 로고" /></span>
          <span class="brand-name">한마음 <strong>케어플랜 체크</strong></span>
        </div>
        <button type="button" id="logoutButton" class="logout-button">로그아웃</button>
      </header>
      <section class="dashboard-hero" aria-labelledby="dashboardTitle">
        <span class="section-kicker">STAFF WORKSPACE</span>
        <h1 id="dashboardTitle">로그인이 완료되었습니다.</h1>
        <p><strong id="staffName"></strong>님, 환영합니다.</p>
        <p class="account-email" id="staffEmail"></p>
      </section>
      <section class="dashboard-card" aria-labelledby="nextStepTitle">
        <span class="dashboard-card-icon" aria-hidden="true">✓</span>
        <div>
          <h2 id="nextStepTitle">계정 인증 및 직원 승인 확인 완료</h2>
          <p>케어포 엑셀 업로드와 장기요양계획서 대조 기능은 다음 개발 단계에서 추가됩니다.</p>
          <p class="dashboard-caption">아직 실제 어르신 자료를 업로드하지 마세요. 데이터 저장과 권한별 접근 제어를 별도로 구현해야 합니다.</p>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
